function bggSearchResultsHtml(query){
  if(!BGG_LIBRARY_CACHE) return '<p class="muted">Caricamento database offline…</p>';
  var q = query.trim().toLowerCase();
  if(!q) return '<p class="muted">Digita per cercare tra i ' + BGG_LIBRARY_CACHE.length + ' giochi del database offline…</p>';
  var matches = BGG_LIBRARY_CACHE.filter(function(item){ return item.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 30);
  if(!matches.length) return '<p class="muted">Nessun risultato per "' + escapeHtml(query) + '". Puoi aggiungerlo a mano.</p>';
  return matches.map(function(item){
    var thumb = item.image
      ? '<img class="cover-thumb" src="' + escapeHtml(item.image) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<span class=&quot;die-badge&quot;>🎲</span>\'">'
      : '<span class="die-badge">🎲</span>';
    return '<div class="game-card" style="cursor:pointer;" data-action="pick-bgg-result" data-bggid="' + escapeHtml(item.bggId) + '">' + thumb
      + '<div class="game-card-body"><div class="name">' + escapeHtml(item.name) + '</div>'
      + '<div class="meta">' + (item.type ? '<span class="chip type-chip">' + escapeHtml(TYPE_MAP[item.type] || item.type) + '</span>' : '') + '</div></div></div>';
  }).join('');
}
function updateBggSearchResults(query){
  var el = document.getElementById('bgg-search-results');
  if(el) el.innerHTML = bggSearchResultsHtml(query);
}

/* ================= ROUTER ================= */
var app = document.getElementById('app');
function currentRoute(){
  var hash = location.hash.replace(/^#\/?/, '');
  return hash ? hash.split('/') : ['list'];
}
function updateActiveNav(page){
  document.querySelectorAll('#nav-list a').forEach(function(a){
    a.classList.toggle('active', a.dataset.page === page);
  });
}
function render(){
  var parts = currentRoute();
  var page = parts[0] || 'list';
  var html;
  switch(page){
    case 'list': html = renderListPage(); break;
    case 'game': html = renderGameDetail(parts[1]); break;
    case 'stats': html = renderStatsPage(); break;
    case 'wishlist': html = renderWishlistPage(); break;
    case 'sell': html = renderSellPage(); break;
    case 'designer': html = renderDesignerPage(); break;
    case 'randomizer': html = renderRandomizerPage(); break;
    case 'editorial': html = parts[1] ? renderEdContentDetail(parts[1]) : renderEditorialPage(); break;
    default: html = renderListPage(); page = 'list';
  }
  app.innerHTML = html;
  updateActiveNav(page);
  window.scrollTo(0,0);
  closeSidebar();
}

/* ================= SIDEBAR / TEMA ================= */
var sidebar = document.getElementById('sidebar');
var overlay = document.querySelector('.sidebar-overlay');
function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeSidebar(){ if(window.innerWidth < 960){ sidebar.classList.remove('open'); overlay.classList.remove('show'); } }
function toggleSidebar(){ sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); }

function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'light'; }
function applyThemeButtonLabel(){
  var btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = currentTheme() === 'dark' ? '☀️ Chiaro' : '🌙 Scuro';
}
function toggleTheme(){
  var next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  applyThemeButtonLabel();
}

/* ================= EVENT DELEGATION ================= */
document.addEventListener('click', function(e){
  if(edSuppressClick){ edSuppressClick = false; e.preventDefault(); return; }
  if(e.target.classList && e.target.classList.contains('modal-backdrop')){ closeModal(); return; }
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;
  switch(action){
    case 'toggle-sidebar': toggleSidebar(); break;
    case 'close-sidebar': closeSidebar(); break;
    case 'theme-toggle': toggleTheme(); break;
    case 'modal-close': closeModal(); break;

    case 'open-add-game': openAddGameSearchModal(); break;
    case 'open-add-game-manual': openGameModal('add'); break;
    case 'pick-bgg-result': {
      var picked = (BGG_LIBRARY_CACHE || []).find(function(it){ return it.bggId === el.dataset.bggid; });
      if(picked) openGameModal('add', null, null, picked);
      break;
    }
    case 'open-edit-game': openGameModal('edit', id); break;
    case 'open-delete-game': openDeleteGameModal(id); break;
    case 'confirm-delete-game':
      DB.games = DB.games.filter(function(g){ return g.id !== id; });
      saveDB(); closeModal();
      if(location.hash.indexOf('#/game/') === 0) location.hash = '#/list'; else render();
      toast('Gioco eliminato');
      break;

    case 'toggle-mech-filter':
      UI.mechFilters.has(el.dataset.value) ? UI.mechFilters.delete(el.dataset.value) : UI.mechFilters.add(el.dataset.value);
      render(); break;
    case 'toggle-type-filter':
      UI.typeFilters.has(el.dataset.value) ? UI.typeFilters.delete(el.dataset.value) : UI.typeFilters.add(el.dataset.value);
      render(); break;
    case 'clear-filters':
      UI.listSearch = ''; UI.mechFilters.clear(); UI.typeFilters.clear(); render(); break;

    case 'game-play-inc': openWinnerModal(id); break;
    case 'game-play-dec': {
      var gd = findGame(id);
      if(gd && gd.plays.length){ gd.plays.pop(); saveDB(); render(); }
      break;
    }
    case 'select-winner': {
      var gameId = el.dataset.game;
      var winnerId = el.dataset.winner;
      var dateInput = document.getElementById('play-date');
      var date = (dateInput && dateInput.value) || todayISO();
      var gg = findGame(gameId);
      if(gg){ gg.plays.push({ id: uid('play'), date: date, winnerId: winnerId || null }); saveDB(); }
      closeModal(); render(); toast('Partita registrata!');
      break;
    }
    case 'delete-play': {
      var gm = findGame(el.dataset.game);
      if(gm){ gm.plays = gm.plays.filter(function(p){ return p.id !== el.dataset.play; }); saveDB(); render(); }
      break;
    }
    case 'prompt-add-player': {
      var newP = addPlayerProfile();
      if(newP) openWinnerModal(el.dataset.game);
      break;
    }
    case 'add-player-profile': {
      var newP2 = addPlayerProfile();
      if(newP2){ render(); toast('Profilo "' + newP2.name + '" aggiunto'); }
      break;
    }

    case 'open-add-wishlist': openWishlistModal('add'); break;
    case 'open-edit-wishlist': openWishlistModal('edit', id); break;
    case 'delete-wishlist':
      if(confirm('Eliminare questa voce dalla wishlist?')){
        DB.wishlist = DB.wishlist.filter(function(w){ return w.id !== id; });
        saveDB(); render();
      }
      break;
    case 'promote-wishlist': {
      var w = DB.wishlist.find(function(x){ return x.id === id; });
      if(w) openGameModal('add', null, w.id, w.name);
      break;
    }

    case 'sell-tab': UI.sellTab = el.dataset.value; render(); break;
    case 'toggle-forsale': {
      var gs = findGame(id);
      if(gs){ gs.forSale = !gs.forSale; saveDB(); render(); }
      break;
    }

    case 'designer-tab': UI.designerTab = el.dataset.value; render(); break;
    case 'open-add-project': openProjectModal('add'); break;
    case 'open-edit-project': openProjectModal('edit', id); break;
    case 'delete-project':
      if(confirm('Eliminare questo progetto e tutti i suoi task?')){
        DB.designer.projects = DB.designer.projects.filter(function(p){ return p.id !== id; });
        DB.designer.ideas.forEach(function(i){ if(i.projectId === id) i.projectId = null; });
        saveDB(); render();
      }
      break;
    case 'add-task': {
      var text = prompt('Descrizione del task da fare:');
      if(text && text.trim()){
        var proj = findProject(el.dataset.project);
        if(proj){ proj.tasks = proj.tasks || []; proj.tasks.push({ id: uid('task'), text: text.trim(), done:false }); saveDB(); render(); }
      }
      break;
    }
    case 'delete-task': {
      var proj2 = findProject(el.dataset.project);
      if(proj2){ proj2.tasks = (proj2.tasks||[]).filter(function(t){ return t.id !== el.dataset.task; }); saveDB(); render(); }
      break;
    }
    case 'open-add-idea': openIdeaModal(); break;
    case 'delete-idea':
      if(confirm('Eliminare questa idea?')){
        DB.designer.ideas = DB.designer.ideas.filter(function(i){ return i.id !== id; });
        saveDB(); render();
      }
      break;

    case 'draw-game': drawGame(); break;
    case 'toggle-rand-type':
      UI.rand.types.has(el.dataset.value) ? UI.rand.types.delete(el.dataset.value) : UI.rand.types.add(el.dataset.value);
      UI.rand.resultId = null; render(); break;
    case 'toggle-rand-mech':
      UI.rand.mechs.has(el.dataset.value) ? UI.rand.mechs.delete(el.dataset.value) : UI.rand.mechs.add(el.dataset.value);
      UI.rand.resultId = null; render(); break;

    case 'open-sync-setup': openSyncSetupModal(); break;
    case 'gist-push': gistPush(); break;
    case 'gist-pull': gistPull(); break;
    case 'export-json': exportJson(); break;
    case 'export-games-json': exportGamesJson(); break;
    case 'reload-app': location.reload(); break;
    case 'cleanup-unplayed-bgg': cleanupUnplayedBggGames(); break;

    case 'ed-tab': UI.edTab = el.dataset.value; render(); break;
    case 'ed-content-sub': UI.edContentSub = el.dataset.value; render(); break;
    case 'open-ed-guide': openEdGuideModal(); break;
    case 'add-ed-content': {
      var edOrder = DB.editorial.contents.length ? Math.max.apply(null, DB.editorial.contents.map(function(c){ return c.order||0; })) + 1 : 0;
      var newEdContent = { id: uid('ed'), title: '', idea: '', status: 'idea', category: '', dateExpected: '', platforms: [], notes: '', script: '', materials: '', timeline: [], createdAt: Date.now(), order: edOrder };
      DB.editorial.contents.push(newEdContent);
      saveDB();
      UI.edContentSub = 'info';
      location.hash = '#/editorial/' + newEdContent.id;
      break;
    }
    case 'ed-delete-content':
      if(confirm('Eliminare questo contenuto e tutta la sua timeline? Azione non annullabile.')){
        DB.editorial.contents = DB.editorial.contents.filter(function(c){ return c.id !== id; });
        saveDB();
        location.hash = '#/editorial';
      }
      break;
    case 'ed-move-up': edMoveContent(id, -1); break;
    case 'ed-move-down': edMoveContent(id, 1); break;
    case 'ed-toggle-platform': {
      var edc = edFindContent(id);
      if(edc){
        var pIdx = edc.platforms.indexOf(el.dataset.platform);
        if(pIdx >= 0) edc.platforms.splice(pIdx, 1); else edc.platforms.push(el.dataset.platform);
        saveDB(); render();
      }
      break;
    }
    case 'ed-remove-platform':
      DB.editorial.platforms = DB.editorial.platforms.filter(function(p){ return p !== el.dataset.platform; });
      saveDB(); render();
      break;
    case 'ed-reset-contents':
      if(confirm('Eliminare definitivamente tutti i contenuti del piano editoriale? Tipi personalizzati e piattaforme restano. Azione non annullabile.')){
        DB.editorial.contents = [];
        saveDB(); render(); toast('Piano editoriale svuotato');
      }
      break;
    case 'ed-add-type': openEdTypeModal(null); break;
    case 'ed-edit-type': openEdTypeModal(id); break;
    case 'ed-delete-type':
      if(confirm('Eliminare questo tipo? Resterà nei blocchi che lo usano già come testo semplice, ma non sarà più selezionabile.')){
        DB.editorial.customTypes = DB.editorial.customTypes.filter(function(x){ return x.id !== id; });
        saveDB(); closeModal(); render();
      }
      break;
    case 'ed-open-block': openEdBlockModal(el.dataset.content, el.dataset.block); break;
    case 'ed-add-block': openEdBlockModal(el.dataset.content, null); break;
    case 'ed-dup-block': case 'ed-dup-block-modal': {
      var edc2 = edFindContent(el.dataset.content);
      var b2 = edc2 && edc2.timeline.find(function(x){ return x.id === el.dataset.block; });
      if(edc2 && b2){
        var order2 = edc2.timeline.length ? Math.max.apply(null, edc2.timeline.map(function(x){ return x.order||0; })) + 1 : 0;
        edc2.timeline.push(Object.assign({}, b2, { id: uid('blk'), order: order2 }));
        saveDB();
        if(action === 'ed-dup-block-modal') closeModal();
        render(); toast('Blocco duplicato');
      }
      break;
    }
    case 'ed-del-block': case 'ed-del-block-modal': {
      var edc3 = edFindContent(el.dataset.content);
      if(edc3 && confirm('Eliminare questo blocco?')){
        edc3.timeline = edc3.timeline.filter(function(x){ return x.id !== el.dataset.block; });
        saveDB();
        if(action === 'ed-del-block-modal') closeModal();
        render();
      }
      break;
    }
    case 'ed-toggle-type':
      if(EDBLOCKSEL.has(el.dataset.tid)) EDBLOCKSEL.delete(el.dataset.tid); else EDBLOCKSEL.add(el.dataset.tid);
      var edGrid = document.getElementById('ed-block-typegrid');
      if(edGrid) edGrid.innerHTML = edTypeGridHtml();
      break;
    case 'ed-dur-minus': {
      var edDurInp = document.querySelector('input[name="duration"]');
      if(edDurInp) edDurInp.value = Math.max(0, (Number(edDurInp.value)||0) - 1);
      break;
    }
    case 'ed-dur-plus': {
      var edDurInp2 = document.querySelector('input[name="duration"]');
      if(edDurInp2) edDurInp2.value = (Number(edDurInp2.value)||0) + 1;
      break;
    }
    case 'ed-new-type-inline': {
      var existingPanel = document.getElementById('ed-inline-newtype');
      if(existingPanel){ existingPanel.remove(); break; }
      var panelHtml = '<div id="ed-inline-newtype" class="section-card" style="margin-top:10px;">'
        + '<div class="field"><label>Nome</label><input type="text" id="ed-nt-name" placeholder="es. Intervista telefonica"></div>'
        + '<div class="field-row">'
        + '<div class="field"><label>Icona (emoji)</label><input type="text" id="ed-nt-icon" value="🔹" maxlength="4"></div>'
        + '<div class="field"><label>Gruppo</label><select id="ed-nt-group">' + Object.keys(ED_GROUPS).map(function(g){ return '<option value="' + g + '">' + ED_GROUPS[g].label + '</option>'; }).join('') + '</select></div>'
        + '</div>'
        + '<button type="button" class="btn-primary" data-action="ed-save-inline-type">Crea e seleziona</button>'
        + '</div>';
      el.insertAdjacentHTML('afterend', panelHtml);
      break;
    }
    case 'ed-save-inline-type': {
      var ntName = document.getElementById('ed-nt-name');
      var ntNameVal = ntName ? ntName.value.trim() : '';
      if(!ntNameVal){ toast('Serve un nome'); break; }
      var ntIcon = (document.getElementById('ed-nt-icon') || {}).value || '🔹';
      var ntGroup = (document.getElementById('ed-nt-group') || {}).value || 'video';
      var newEdType = { id: uid('ct'), g: ntGroup, name: ntNameVal, icon: ntIcon };
      DB.editorial.customTypes.push(newEdType);
      saveDB();
      EDBLOCKSEL.add(newEdType.id);
      var ntPanel = document.getElementById('ed-inline-newtype'); if(ntPanel) ntPanel.remove();
      var ntGrid = document.getElementById('ed-block-typegrid'); if(ntGrid) ntGrid.innerHTML = edTypeGridHtml();
      toast('Tipo creato');
      break;
    }
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.matches('select[data-action-change="change-project-phase"]')){
    var p = findProject(el.dataset.id);
    if(p){ p.phase = el.value; saveDB(); render(); }
    return;
  }
  if(el.matches('input[data-action="toggle-task"]')){
    var proj = findProject(el.dataset.project);
    var task = proj && (proj.tasks||[]).find(function(t){ return t.id === el.dataset.task; });
    if(task){ task.done = el.checked; saveDB(); render(); }
    return;
  }
  if(el.matches('textarea[data-action-blur="save-sale-note"]')){
    var g = findGame(el.dataset.id);
    if(g){ g.forSaleNote = el.value; saveDB(); }
    return;
  }
  if(el.matches('input[data-action-change="import-json"]') && el.files && el.files[0]){
    importJsonFile(el.files[0]);
    return;
  }
  if(el.matches('input[data-action-change="import-games-json"]') && el.files && el.files[0]){
    importGamesJsonFile(el.files[0]);
    el.value = '';
    return;
  }
  if(el.matches('input[data-action-change="upload-cover"]') && el.files && el.files[0]){
    handleCoverFileUpload(el.files[0]);
    return;
  }
  if(el.matches('select[data-action-change="ed-status-filter"]')){ UI.edStatusFilter = el.value; render(); return; }
  var edFieldMap = { 'ed-save-title':'title', 'ed-save-idea':'idea', 'ed-save-status':'status', 'ed-save-category':'category', 'ed-save-date':'dateExpected', 'ed-save-notes':'notes', 'ed-save-script':'script', 'ed-save-materials':'materials' };
  var edFieldKey = el.dataset.actionChange;
  if(edFieldKey && edFieldMap[edFieldKey]){
    var edc = edFindContent(el.dataset.id);
    if(edc){ edc[edFieldMap[edFieldKey]] = el.value; saveDB(); render(); }
    return;
  }
});

document.addEventListener('submit', function(e){
  var form = e.target;
  if(form.dataset.form){
    e.preventDefault();
    switch(form.dataset.form){
      case 'game-form': handleGameFormSubmit(form); break;
      case 'wishlist-form': handleWishlistFormSubmit(form); break;
      case 'project-form': handleProjectFormSubmit(form); break;
      case 'idea-form': handleIdeaFormSubmit(form); break;
      case 'ed-block-form': handleEdBlockFormSubmit(form); break;
      case 'ed-type-form': handleEdTypeFormSubmit(form); break;
      case 'ed-plat-form': handleEdPlatFormSubmit(form); break;
      case 'token-form': {
        var fd = new FormData(form);
        var val = (fd.get('token') || '').toString().trim();
        if(val) localStorage.setItem(TOKEN_KEY, val);
        closeModal();
        findOrCreateGist().then(function(){ setSyncStatus('ok'); toast('Collegato al Gist ✓'); })
          .catch(function(err){ setSyncStatus('error'); toast('Errore: ' + err.message); });
        break;
      }
    }
  }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if(el.matches('input[data-search="games"]')){ UI.listSearch = el.value; updateGameListResults(); return; }
  if(el.matches('input[data-search="ideas"]')){ UI.ideaSearch = el.value; updateIdeaLists(); return; }
  if(el.matches('input[data-search="randomizer"]')){ UI.rand.playerCount = el.value; UI.rand.resultId = null; updateRandStage(); return; }
  if(el.matches('input[data-search="bgg-reference"]')){ updateBggSearchResults(el.value); return; }
  if(el.matches('input[data-search="cover-preview"]')){ updateCoverPreview(el.value); return; }
  if(el.matches('input[data-search="editorial"]')){ UI.edSearch = el.value; updateEdContentList(); return; }
});
document.addEventListener('pointerdown', function(e){ edContentPointerDown(e); edBlockPointerDown(e); });
document.addEventListener('touchmove', function(e){ if(EDCDRAG || EDBDRAG) e.preventDefault(); }, { passive: false });

window.addEventListener('hashchange', render);
window.addEventListener('resize', function(){ if(window.innerWidth >= 960){ sidebar.classList.remove('open'); overlay.classList.remove('show'); } });

/* ================= INIT ================= */
applyThemeButtonLabel();
var buildBadgeEl = document.getElementById('build-badge');
if(buildBadgeEl) buildBadgeEl.textContent = APP_BUILD;
if(getToken() && localStorage.getItem(GIST_ID_KEY)) setSyncStatus('idle', 'Collegato — usa ⬇/⬆ per sincronizzare');
if(!location.hash) location.hash = '#/list';
render();

function showUpdateToast(){
  if(document.querySelector('.toast-update')) return;
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast toast-update';
  el.innerHTML = '<span>🔄 Nuova versione disponibile</span><button type="button" data-action="reload-app">Aggiorna</button>';
  root.appendChild(el);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        var newSW = reg.installing;
        if(!newSW) return;
        newSW.addEventListener('statechange', function(){
          if(newSW.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateToast();
          }
        });
      });
    }).catch(function(){});
  });
}

})();
